<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>exames</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 24px; }
    h2 { margin-top: 32px; }
    form { display: flex; flex-direction: column; gap: 8px; max-width: 400px; }
    input { padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; background: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button:hover { background: #005bb5; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #eee; }
    th { background: #f5f5f5; }
    .erro { color: red; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function FormularioExame({ onCriada }) {
      const [nome, setNome] = useState('');
      const [codigo, setCodigo] = useState('');
      const [medicoNome, setMedicoNome] = useState('');
      const [erro, setErro] = useState('');

      async function handleSubmit(e) {
        e.preventDefault();
        setErro('');
        const resposta = await fetch('/exames', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, codigo, medico_nome: medicoNome }),
        });
        if (resposta.ok) {
          setNome('');
          setCodigo('');
          setMedicoNome('');
          onCriada();
        } else {
          const dados = await resposta.json();
          setErro(dados.erro || 'Erro ao criar exame');
        }
      }

      return (
        <form onSubmit={handleSubmit}>
          <input value={nome} onChange={e => setNome(e.target.value)} placeholder="Nome do exame" required />
          <input value={codigo} onChange={e => setCodigo(e.target.value)} placeholder="Código" required />
          <input value={medicoNome} onChange={e => setMedicoNome(e.target.value)} placeholder="Nome do médico" required />
          <button type="submit">Criar exame</button>
          {erro && <p className="erro">{erro}</p>}
        </form>
      );
    }

    function ListaExames({ exames }) {
      if (exames.length === 0) return <p>Nenhum exame registado.</p>;
      return (
        <table>
          <thead>
            <tr><th>#</th><th>Nome</th><th>Código</th><th>Médico</th><th>Data de Criação</th></tr>
          </thead>
          <tbody>
            {exames.map(e => (
              <tr key={e.id}>
                <td>{e.id}</td>
                <td>{e.nome}</td>
                <td>{e.codigo}</td>
                <td>{e.medico_nome}</td>
                <td>{e.dataCriacao || 'não exposta'}</td>
              </tr>
            ))}
          </tbody>
        </table>
      );
    }

    function App() {
      const [exames, setExames] = useState([]);

      async function buscarExames() {
        const resposta = await fetch('/exames');
        const dados = await resposta.json();
        console.log('Dados recebidos:', dados);
        setExames(dados);
      }

      useEffect(() => { buscarExames(); }, []);

      return (
        <div>
          <h1>Sistema de Exames</h1>
          <h2>Novo Exame</h2>
          <FormularioExame onCriada={buscarExames} />
          <h2>Exames Registados</h2>
          <ListaExames exames={exames} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
